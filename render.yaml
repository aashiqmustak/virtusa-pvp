services:
  - type: web
    name: msme-backend
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: msme-db
          property: connectionString
      - key: PORT
        value: "8000"
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: VOICE_ALLOWED_ORIGINS
        value: "*"
      - key: ANALYST_TOKEN
        generateValue: true
      - key: REVIEWER_TOKEN
        generateValue: true
      - key: VOICE_MODE
        value: mock
      - key: LLM_MODE
        value: mock
      - key: POLICY_FILE
        value: /workspace/policy.demo.json
      - key: PRIVATE_STORAGE
        value: /data/uploads

databases:
  - name: msme-db
    databaseName: msme
    user: msme
    plan: free

