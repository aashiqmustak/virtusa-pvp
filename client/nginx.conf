server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 11m;
    location /api/voice/socket {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }
    location /api/ { proxy_pass http://api:8000; proxy_read_timeout 900s; proxy_connect_timeout 10s; }
    location /schema { proxy_pass http://api:8000; }
    location / { try_files $uri $uri/ /index.html; }
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy same-origin;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'";
}
